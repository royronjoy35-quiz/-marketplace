services:
  - type: web
    name: dr-sell-bot-go
    runtime: go
    buildCommand: go mod tidy && go mod download && go build -trimpath -o dr-sell-bot .
    startCommand: ./dr-sell-bot
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MONGO_URL
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BINANCE_PAY
        sync: false
      - key: BYBIT_PAY
        sync: false
      - key: BEP20_ADDRESS
        sync: false
      - key: MIN_AMOUNT
        value: "0.2"
      - key: MAX_AMOUNT
        value: "25.0"
